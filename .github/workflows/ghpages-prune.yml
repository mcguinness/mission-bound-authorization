name: "Prune Branch Previews"

# Every publish rebuilds the gh-pages index over every branch preview, so
# previews of deleted or merged branches slow each push. i-d-template's
# own cleanup keeps a preview for 30 days and cannot see other branches
# from a shallow CI checkout, so this removes them by branch state.

on:
  schedule:
  - cron: '23 7 * * *'
  delete:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prune-branch-previews
  cancel-in-progress: false

jobs:
  prune:
    name: "Prune Branch Previews"
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout"
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.repository.default_branch }}

    - name: "Checkout gh-pages"
      uses: actions/checkout@v6
      with:
        ref: gh-pages
        path: .ghpages
        fetch-depth: 1

    - name: "Prune Previews of Deleted or Merged Branches"
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash scripts/prune-ghpages-previews.sh .ghpages

name: "Update Editor's Copy"

on:
  push:
    paths-ignore:
    - README.md
    - CONTRIBUTING.md
    - LICENSE.md
    - .gitignore
    # The drafts never build from these; a decision-log row, an
    # implementation change or a ledger re-pin needs no draft rebuild
    # or publish.
    - 'src/**'
    - 'notes/**'
    - conformance-manifest.json
    - family-manifest.json
    - candidate-gate.json
    - DRAFTS.md
  pull_request:
    paths-ignore:
    - README.md
    - CONTRIBUTING.md
    - LICENSE.md
    - .gitignore
    - 'src/**'
    - 'notes/**'
    - conformance-manifest.json
    - family-manifest.json
    - candidate-gate.json
    - DRAFTS.md

# A newer push to the same ref supersedes an older build or publish.
concurrency:
  group: editors-copy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Update Editor's Copy"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: "Checkout"
      uses: actions/checkout@v6

    - name: "Setup"
      id: setup
      run: date -u "+date=%FT%T" >>"$GITHUB_OUTPUT"

    - name: "Caching"
      uses: actions/cache@v5
      with:
        path: |
          .refcache
          .venv
          .gems
          node_modules
          .targets.mk
        key: i-d-${{ steps.setup.outputs.date }}
        restore-keys: i-d-

    - name: "Build Drafts"
      id: build
      uses: martinthomson/i-d-template@v1
      with:
        token: ${{ github.token }}

    - name: "Fix Lints"
      id: fix-lint
      if: always() && steps.build.outcome == 'failure'
      uses: martinthomson/i-d-template@v1
      with:
        make: fix-lint

    - name: "Propose Linting Fixes"
      if: >
        always() &&
        steps.fix-lint.outcome != 'skipped' &&
        github.event.pull_request &&
        github.event.pull_request.head.repo.full_name == github.repository
      uses: parkerbxyz/suggest-changes@v3
      with:
        token: ${{ github.token }}

    - name: "Update GitHub Pages"
      id: ghpages
      uses: martinthomson/i-d-template@v1
      if: ${{ github.event_name == 'push' }}
      continue-on-error: true
      with:
        make: gh-pages
        token: ${{ github.token }}

    # Another branch's publish can win the race to push gh-pages. Wait,
    # then publish again from a fresh copy of the branch; a second
    # failure fails the job.
    - name: "Wait Before Retrying GitHub Pages"
      if: ${{ github.event_name == 'push' && steps.ghpages.outcome == 'failure' }}
      run: sleep 30

    - name: "Retry GitHub Pages"
      uses: martinthomson/i-d-template@v1
      if: ${{ github.event_name == 'push' && steps.ghpages.outcome == 'failure' }}
      with:
        make: gh-pages
        token: ${{ github.token }}

    - name: "Archive Built Drafts"
      uses: actions/upload-artifact@v6
      with:
        name: drafts
        path: |
          draft-*.html
          draft-*.txt
